<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Track Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin:0; padding:0; }
    #map { width:100%; height:100vh; }
    .distance-control {
      background: rgba(255,255,255,0.8);
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import * as firestore from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBGhh5I4BQOG-wOBzbqatstfe1OVCb9yuY",
    authDomain: "walkingtracks-f0a9e.firebaseapp.com",
    projectId: "walkingtracks-f0a9e",
    storageBucket: "walkingtracks-f0a9e.firebasestorage.app",
    messagingSenderId: "450365792410",
    appId: "1:450365792410:web:ebe3504aecacf7c45cbf23"
  };

  const app = initializeApp(firebaseConfig);
  const db = firestore.getFirestore(app);

  const map = L.map('map').setView([60.17, 24.94], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  // --- Distance calculation ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000; // meters
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function calculateDistance(coords) {
    let total = 0;
    for (let i = 1; i < coords.length; i++) {
      total += haversine(coords[i-1][1], coords[i-1][0], coords[i][1], coords[i][0]);
    }
    return total;
  }

  // --- Leaflet control for distance ---
  const distanceControl = L.control({ position: 'topright' });
  let totalDistance = 0;

  distanceControl.onAdd = function(map) {
    const div = L.DomUtil.create('div', 'distance-control');
    div.innerHTML = `Distance: 0 km`;
    return div;
  };
  distanceControl.addTo(map);

// --- Polyline decoder ---
function decodePolyline(str) {
  let index = 0, lat = 0, lon = 0;
  const coords = [];

  while (index < str.length) {
    let result = 0, shift = 0, b;

    // Decode latitude
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);

    const dLat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dLat;

    // Decode longitude
    result = 0;
    shift = 0;
    do {
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);

    const dLon = (result & 1) ? ~(result >> 1) : (result >> 1);
    lon += dLon;

    coords.push([lat / 1e5, lon / 1e5]); // [lat, lon]
  }

  return coords;
}

async function fetchAndDrawRoutes() {
    const snapshot = await firestore.getDocs(firestore.collection(db, "gpxTracks"));
    const allCoords = [];
    let mergedBuffer = null;

    for (const doc of snapshot.docs) {
      const data = doc.data();

      if (!data.polyline) continue;

    // Decode → [lat, lon]
    const decoded = decodePolyline(data.polyline);

    // Convert to GeoJSON format [lon, lat]
    const coords = decoded.map(([lat, lon]) => [lon, lat]);

      allCoords.push(...coords);

      // Update total distance
      totalDistance += calculateDistance(coords);

      // Draw red polyline (invisible)
      const latlngs = decoded.map(([lat, lon]) => [lat, lon]);
      L.polyline(latlngs, { color: 'red', weight: 2, opacity: 0 }).addTo(map);

      // Generate Turf.js LineString and buffer
      const line = turf.lineString(coords);
      const buffered = turf.buffer(line, 25, { units: 'meters' });

      // Merge buffers
      if (!mergedBuffer) mergedBuffer = buffered;
      else mergedBuffer = turf.union(mergedBuffer, buffered);
    }

    // Draw merged buffer with fill and edge
    if (mergedBuffer) {
      L.geoJSON(mergedBuffer, { 
        style: { color: 'darkblue', weight: 2, fillColor: 'blue', fillOpacity: 0.2 } 
      }).addTo(map);
    }

    // Fit map to all coordinates
    if (allCoords.length) {
      const latlngs = allCoords.map(c => [c[1], c[0]]);
      map.fitBounds(latlngs);
    }

    // Update distance display
    const div = document.querySelector('.distance-control');
    div.innerHTML = `Distance: ${(totalDistance/1000).toFixed(2)} km`;
  }

  fetchAndDrawRoutes();


  // -----------------------------
// Live tracking layer (red)
// -----------------------------

const editPoints = [];
let editLine = null;
let editBuffer = null;

let watchId = null;
let lastPoint = null;
let hasCenteredMap = false;

const MIN_DISTANCE_METERS = 5;
const MAX_ACCURACY_METERS = 20;

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
  
function updateEditBuffer() {

  if (editLine) {
    map.removeLayer(editLine);
    editLine = null;
  }

  if (editBuffer) {
    map.removeLayer(editBuffer);
    editBuffer = null;
  }

  if (editPoints.length < 2)
    return;

  editLine = L.polyline(editPoints, {
    color: "red",
    weight: 2,
    opacity: 0
  }).addTo(map);

  const coords = editPoints.map(([lat, lng]) => [lng, lat]);

  const line = turf.lineString(coords);

  const buffered = turf.buffer(line, 25, {
    units: "meters"
  });

  editBuffer = L.geoJSON(buffered, {
    style: {
      color: "darkred",
      weight: 2,
      fillColor: "red",
      fillOpacity: 0.25
    }
  }).addTo(map);
}
function startTracking() {

    alert("watchPosition() being started");

    watchId = navigator.geolocation.watchPosition(

        (position) => {

            alert(
                "WATCH UPDATE\n\n" +
                position.coords.latitude +
                "\n" +
                position.coords.longitude +
                "\nAccuracy: " +
                position.coords.accuracy
            );

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            if (!lastPoint) {
                lastPoint = [lat, lng];
                editPoints.push(lastPoint);
                updateEditBuffer();
                return;
            }

            const moved = distanceMeters(
                lastPoint[0],
                lastPoint[1],
                lat,
                lng
            );

            alert("Moved " + moved.toFixed(1) + " meters");

            if (moved < 5)
                return;

            lastPoint = [lat, lng];
            editPoints.push(lastPoint);

            updateEditBuffer();

        },

        (err) => {

            alert(
                "WATCH ERROR\n\n" +
                "Code: " + err.code +
                "\nMessage: " + err.message
            );

            console.error(err);

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

    alert("watchId = " + watchId);

}
function requestLocationPermission() {

    alert("1. Button clicked");

    alert("2. Protocol: " + location.protocol);

    alert("3. navigator.geolocation = " + (navigator.geolocation ? "YES" : "NO"));

    if (!navigator.geolocation) {
        alert("Geolocation API NOT available.");
        return;
    }

    navigator.permissions?.query({ name: "geolocation" }).then(result => {
        alert("4. Permission state: " + result.state);
    }).catch(e => {
        alert("4. Permissions API unavailable: " + e);
    });

    alert("5. Calling getCurrentPosition()...");

    navigator.geolocation.getCurrentPosition(

        (position) => {

            alert(
                "6. SUCCESS\n\n" +
                "Latitude: " + position.coords.latitude +
                "\nLongitude: " + position.coords.longitude +
                "\nAccuracy: " + position.coords.accuracy + " m"
            );

            editPoints.push([
                position.coords.latitude,
                position.coords.longitude
            ]);

            lastPoint = [
                position.coords.latitude,
                position.coords.longitude
            ];

            updateEditBuffer();

            startTracking();

            alert("7. watchPosition() started");

        },

        (err) => {

            alert(
                "ERROR\n\n" +
                "Code: " + err.code +
                "\nMessage: " + err.message
            );

            console.error(err);

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}

requestLocationPermission();

</script>

<button id="startGPS"
style="
position:absolute;
top:10px;
left:10px;
z-index:1000;
padding:12px;
">
Start GPS
</button>
<script>
    document.getElementById("startGPS").addEventListener("click", () => {
    requestLocationPermission();
});
</script>

</body>
</html>
